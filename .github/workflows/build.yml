name: 📦 Build and Append Wheels

on:
  workflow_dispatch:
    inputs:
      build_windows:
        type: boolean
        description: 'Build for Windows'
        default: true
      build_linux:
        type: boolean
        description: 'Build for Linux'
        default: false
      build_macos:
        type: boolean
        description: 'Build for macOS'
        default: false

defaults:
  run:
    shell: bash

jobs:
  prepare-matrix:
    name: Prepare Build Matrix
    runs-on: ubuntu-latest
    outputs:
      os_matrix: ${{ steps.set_matrix.outputs.os_matrix }}

    steps:
      - name: Determine which platforms to build
        id: set_matrix
        run: |
          matrix="[]"
          if [ "${{ github.event.inputs.build_windows }}" == "true" ]; then
            matrix=$(echo "$matrix" | jq '. + ["windows-latest"]')
          fi
          if [ "${{ github.event.inputs.build_linux }}" == "true" ]; then
            matrix=$(echo "$matrix" | jq '. + ["ubuntu-latest"]')
          fi
          if [ "${{ github.event.inputs.build_macos }}" == "true" ]; then
            matrix=$(echo "$matrix" | jq '. + ["macos-latest"]')
          fi
          echo "os_matrix=${matrix}" >> $GITHUB_OUTPUT

  build:
    name: Build on ${{ matrix.os }}
    needs: prepare-matrix
    # skip entirely if no platforms were selected.
    if: needs.prepare-matrix.outputs.os_matrix != '[]'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.prepare-matrix.outputs.os_matrix) }}
  
    steps:
      - uses: actions/checkout@v4
      - uses: melmass/actions@nukit
        with:
          script: |
            let version = (open pyproject.toml).project

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.3"

      - name: Set up Python
        run: uv python install

      - name: Install
        run: uv sync

      - name: Build
        run: \
          cd cv
          uv build --out-dir ../dist
      - name: Upload wheel as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-wheel-${{ matrix.os }}
          path: dist/*.whl

  append-to-release:
    name: Append to 'wheels' Release
    needs: [prepare-matrix, build]
    if: success() && needs.prepare-matrix.outputs.os_matrix != '[]'
    runs-on: ubuntu-latest

    steps:
      - name: Download all built wheels
        uses: actions/download-artifact@v4
        with:
          pattern: python-wheel-*
          path: dist-all
          merge-multiple: true

      - name: Check for asset collisions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING_ASSETS=$(gh release view wheels --json assets --jq '.assets[].name' || true)
          echo "Existing assets in 'wheels' release:"
          echo "$EXISTING_ASSETS"

          for file in dist-all/*.whl; do
            filename=$(basename "$file")
            if echo "$EXISTING_ASSETS" | grep -Fxq "$filename"; then
              echo "❌ ERROR: Asset '$filename' already exists. To prevent collisions, please bump the version in pyproject.toml."
              exit 1
            fi
            echo "✅ OK: Asset '$filename' can be uploaded."
          done

      - name: Append assets to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "wheels"
          files: dist-all/*.whl
          body: "Rolling release of built wheels. Assets are added from CI builds."
