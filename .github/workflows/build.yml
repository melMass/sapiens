name: 📦 Build and Append Wheels

on:
  workflow_dispatch:
    inputs:
      allow_overwrite:
        type: boolean
        description: 'If true, overwrite assets in the release if they already exist.'
        default: false
      strict:
        type: boolean
        description: 'If true, the entire workflow fails if any single build fails.'
        default: false
      torch_index_name:
        description: '[NOT USED YET] PyTorch index (only for windows and linux)'
        required: false
        type: choice
        # These are the 'name' fields from [[tool.uv.index]] in your pyproject.toml
        options:
          - 'default-pypi'
          - 'pytorch-cu121'
          - 'pytorch-nightly-cu124'
          - 'pytorch-cpu'
        default: 'pytorch-nightly-cu124'
      python_version:
        description: 'Optional: Specify a Python version (e.g., "3.11"). If blank, uv finds the best match.'
        required: false
        type: string
        default: ''
      build_windows:
        type: boolean
        description: 'Build for Windows'
        default: true
      build_linux:
        type: boolean
        description: 'Build for Linux'
        default: false
      build_macos:
        type: boolean
        description: 'Build for macOS'
        default: false

defaults:
  run:
    shell: bash

jobs:
  prepare-matrix:
    name: Prepare Build Matrix
    runs-on: ubuntu-latest
    outputs:
      os_matrix: ${{ steps.set_matrix.outputs.os_matrix }}

    steps:
      - name: Determine which platforms to build
        id: set_matrix
        run: |
          matrix="[]"
          if [ "${{ github.event.inputs.build_windows }}" == "true" ]; then
            matrix=$(echo "$matrix" | jq -c '. + ["windows-latest"]')
          fi
          if [ "${{ github.event.inputs.build_linux }}" == "true" ]; then
            matrix=$(echo "$matrix" | jq -c '. + ["ubuntu-latest"]')
          fi
          if [ "${{ github.event.inputs.build_macos }}" == "true" ]; then
            matrix=$(echo "$matrix" | jq -c '. + ["macos-latest"]')
          fi
          echo "os_matrix=${matrix}" >> $GITHUB_OUTPUT

  build:
    name: Build on ${{ matrix.os }}
    needs: prepare-matrix
    # skip entirely if no platforms were selected.
    if: needs.prepare-matrix.outputs.os_matrix != '[]'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.prepare-matrix.outputs.os_matrix) }}
  
    steps:
      - uses: actions/checkout@v4
      # - uses: melmass/actions@nukit
      #   with:
      #     script: |
      #       let version = (open pyproject.toml).project

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.8"

      - name: Install
        run: |

          if [[ -n "${{ inputs.python_version }}" ]]; then
            uv sync --all-extras --all-groups --python "${{ inputs.python_version }}"
          else
            uv sync --all-extras --all-groups
          fi

      - name: Build
        working-directory: ./cv
        run: uv build --out-dir ../dist

      - name: Upload wheel as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-wheel-${{ matrix.os }}
          path: dist/*.whl

  append-to-release:
    name: Append to 'wheels' Release
    needs: [prepare-matrix, build]
    if: (inputs.strict == false || success()) && needs.prepare-matrix.outputs.os_matrix != '[]' 
    runs-on: ubuntu-latest

    steps:
      - name: Download all built wheels
        uses: actions/download-artifact@v4
        with:
          pattern: python-wheel-*
          path: dist-all
          merge-multiple: true

      - name: Append assets to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "wheels"
          files: dist-all/*.whl
          body: "Rolling release of built wheels. Assets are added from CI builds."
          overwrite_files: ${{ inputs.allow_overwrite }}
